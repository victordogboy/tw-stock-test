<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V1.16.0-R10｜One-click Master Audit｜基底 V1.14.2-R3</title><style>
body{font-family:system-ui;background:#07111f;color:#eaf1ff;margin:18px}.box{background:#0d1b2e;border:1px solid #29415f;border-radius:12px;padding:14px;margin:12px 0}button,input{background:#10243d;color:#fff;border:1px solid #3a587e;border-radius:7px;padding:9px;margin:3px}.ok{color:#42db9b}.bad{color:#ff6f7e}.warn{color:#ffd36a}.muted{color:#9fb1cb}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px;border-bottom:1px solid #223957;text-align:left;vertical-align:top}.sticky{position:sticky;top:0;background:#0d1b2e}pre{white-space:pre-wrap;word-break:break-all}</style></head><body>
<h1>V1.16.0-R10｜One-click Master Audit</h1>
<div class="box"><b>這版一次測完，不再拆版本。</b><p class="muted">同一次測：TWSE、TPEx、多路徑 TPEx transport、Yahoo Daily、Yahoo 1m、FinMind 核心與延伸 datasets、TDCC。沒有可驗證日期就標 ?；FinMind 402 後停止浪費 quota。Scanner / V4.4 / Action 完全不動。</p>
<label>上市 <input id="L" value="2330"></label><label>上櫃 <input id="O" value="5347"></label><label>Target <input id="T" value="2026-09-11"></label>
<button id="run">▶ 一鍵全部測完</button><button id="stop">停止</button><b id="status" class="muted"></b></div>
<div class="box"><h2>總表</h2><div style="overflow:auto;max-height:72vh"><table><thead class="sticky"><tr><th>來源</th><th>市場</th><th>類別/Dataset</th><th>HTTP</th><th>日期</th><th>Target</th><th>筆數</th><th>摘要</th><th>耗時</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="box"><h2>自動結論</h2><pre id="summary" class="muted"></pre></div>
<script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let stopped=false,results=[];
$('stop').onclick=()=>stopped=true;
async function get(u){let t=performance.now();try{let r=await fetch(u,{cache:'no-store'}),x=await r.text(),j=null;try{j=JSON.parse(x)}catch{}return{ok:r.ok,status:r.status,j,text:x,ms:Math.round(performance.now()-t)}}catch(e){return{ok:false,status:'FETCH',j:null,text:String(e),ms:Math.round(performance.now()-t)}}}
function add(src,mkt,cat,r,date,rows,sum){let T=$('T').value,m=date?date===T:null;results.push({src,mkt,cat,status:r.status,date,rows,match:m});let tr=document.createElement('tr');tr.innerHTML=`<td>${esc(src)}</td><td>${mkt}</td><td>${esc(cat)}</td><td class="${r.ok?'ok':'bad'}">${esc(r.status)}</td><td>${esc(date||'—')}</td><td class="${m===true?'ok':m===false?'bad':'warn'}">${m===true?'✓':m===false?'✗':'?'}</td><td>${esc(rows??'—')}</td><td>${esc(sum||'')}</td><td>${r.ms} ms</td>`;$('rows').appendChild(tr)}
function latest(a){return a.map(x=>x?.date).filter(Boolean).sort().at(-1)||null}
async function official(source,path,code,cat){let r=await get(`/api/audit/endpoint?source=${source}&path=${encodeURIComponent(path)}&code=${code}`),j=r.j||{};add(source.toUpperCase(),source==='twse'?'上市':'上櫃',cat,r,j.latest_date,j.rows,j.matched?Object.entries(j.matched).slice(0,14).map(([k,v])=>`${k}=${v}`).join(' | '):(j.error||j.keys?.slice(0,12).join(', ')));return r}
async function yahoo(code,mkt,interval){let r=await get(`/api/audit/yahoo?code=${code}&market=${mkt}&interval=${interval}`),j=r.j||{},d=j.last?.t?new Date(j.last.t*1000).toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'}):null;add('Yahoo',mkt==='twse'?'上市':'上櫃',interval==='1m'?'1m intraday':'Daily',r,d,j.rows,j.last?`O=${j.last.open} H=${j.last.high} L=${j.last.low} C=${j.last.close} V=${j.last.volume} | state=${j.market_state||'—'}`:j.error);return r}
async function fm(code,mkt,ds){let T=$('T').value,r=await get(`/api/finmind?dataset=${encodeURIComponent(ds)}&data_id=${code}&start_date=2026-08-01&end_date=${T}&_=${Date.now()}`),a=Array.isArray(r.j?.data)?r.j.data:[],d=latest(a),msg=a.length?Object.entries(a.at(-1)).slice(0,14).map(([k,v])=>`${k}=${v}`).join(' | '):(r.j?.error||r.j?.msg||'');add('FinMind',mkt,ds,r,d,a.length,msg);return {r,quota:r.status===502&&/402|upper limit|quota/i.test(JSON.stringify(r.j||{}))}}
const CORE_TWSE=[['/exchangeReport/STOCK_DAY_ALL','價格'],['/exchangeReport/MI_MARGN','融資融券'],['/fund/T86','三大法人'],['/exchangeReport/TWTB4U','當沖/交易狀態'],['/SBL/TWT96U','借券'],['/exchangeReport/BWIBBU_ALL','估值'],['/opendata/t187ap05_L','月營收'],['/opendata/t187ap02_L','大股東'],['/opendata/t187ap11_L','內部人持股']];
const CORE_TPEX=[['/tpex_mainboard_daily_close_quotes','價格'],['/tpex_mainboard_margin_balance','融資融券'],['/tpex_3insti_daily_trading','三大法人'],['/tpex_intraday_trading_statistics','當沖'],['/tpex_margin_sbl','借券'],['/tpex_mainboard_peratio_analysis','估值'],['/mopsfin_t187ap05_O','月營收'],['/mopsfin_t187ap02_O','大股東'],['/mopsfin_t187ap11_O','內部人持股']];
const FM=['TaiwanStockPrice','TaiwanStockPriceAdj','TaiwanStockPER','TaiwanStockDayTrading','TaiwanStockMarginPurchaseShortSale','TaiwanStockInstitutionalInvestorsBuySell','TaiwanStockInstitutionalInvestorsBuySellWide','TaiwanStockSecuritiesLending','TaiwanStockShareholding','TaiwanStockHoldingSharesPer','TaiwanStockMarketValue','TaiwanStockMonthRevenue','TaiwanStockDividend','TaiwanStockDividendResult','TaiwanStockFinancialStatements','TaiwanStockBalanceSheet','TaiwanStockCashFlowsStatement','TaiwanStockTotalReturnIndex','TaiwanStockMarginMaintenance','TaiwanStockGovernmentBankBuySell'];
$('run').onclick=async()=>{stopped=false;results=[];$('rows').innerHTML='';$('summary').textContent='';let L=$('L').value.trim(),O=$('O').value.trim();
let jobs=0,total=CORE_TWSE.length+CORE_TPEX.length+4+FM.length*2+2;const st=x=>$('status').textContent=`${++jobs}/${total} ${x}`;
for(const [p,c] of CORE_TWSE){if(stopped)return;st(`TWSE ${c}`);await official('twse',p,L,c)}
for(const [p,c] of CORE_TPEX){if(stopped)return;st(`TPEx ${c}`);await official('tpex',p,O,c)}
for(const [code,mkt] of [[L,'twse'],[O,'tpex']])for(const int of ['1d','1m']){if(stopped)return;st(`Yahoo ${code} ${int}`);await yahoo(code,mkt,int)}
st('TPEx transport');let tr=await get('/api/audit/tpex-transport?path=tpex_mainboard_daily_close_quotes');for(const a of tr.j?.attempts||[])add('TPEx Transport','上櫃',a.upstream,{ok:Number(a.status)>=200&&Number(a.status)<400,status:a.status,ms:a.ms},null,null,`location=${a.location||'—'} | ${a.preview||a.error||''}`);
let quota=false;for(const [code,mkt] of [[L,'上市'],[O,'上櫃']])for(const ds of FM){if(stopped)return;if(quota){add('FinMind',mkt,ds,{ok:false,status:'SKIP',ms:0},null,null,'SKIP-QUOTA');continue}st(`FinMind ${code} ${ds}`);let x=await fm(code,mkt,ds);if(x.quota)quota=true;await new Promise(r=>setTimeout(r,120))}
st('TDCC');let td=await get('/api/audit/tdcc');add('TDCC','上市/上櫃','股權分散官方頁',td,null,null,td.j?.note||td.j?.error||'');
st('FinMind catalog');let fc=await get('/api/audit/finmind-catalog');add('FinMind','台灣市場','Dataset catalog',fc,null,fc.j?.count,fc.j?.ok?`catalog=${fc.j.count} datasets`:(fc.j?.error||''));
let ok=results.filter(x=>String(x.status)==='200').length,target=results.filter(x=>x.match===true).length,stale=results.filter(x=>x.match===false).length,fail=results.filter(x=>!['200','SKIP'].includes(String(x.status))).length;
$('summary').textContent=`總測試列：${results.length}\nHTTP 200：${ok}\nTarget date 命中：${target}\n可驗證但落後：${stale}\nHTTP/FETCH 失敗：${fail}\n\n注意：Target 未知(?)不等於過期；代表來源本身沒有被 R9 可靠辨識到日期，不能自行補日期。\nFinMind 若遇 402，後續 SKIP 是刻意保護匿名 quota。`;
$('status').textContent='全部完成';};
</script></body></html>
