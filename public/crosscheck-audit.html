<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V1.16.0-R10｜Cross-check Audit｜基底 V1.14.2-R3</title><style>
body{font-family:system-ui;background:#07111f;color:#eaf1ff;margin:18px}.box{background:#0d1b2e;border:1px solid #29415f;border-radius:12px;padding:14px;margin:12px 0}button,input{background:#10243d;color:#fff;border:1px solid #3a587e;border-radius:7px;padding:8px;margin:3px}.ok{color:#42db9b}.bad{color:#ff6f7e}.warn{color:#ffd36a}.muted{color:#9fb1cb}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px;border-bottom:1px solid #223957;text-align:left;vertical-align:top}pre{white-space:pre-wrap;word-break:break-all}</style></head><body>
<h1>V1.16.0-R10｜Cross-check Audit</h1>
<div class="box"><b>這輪只做資料驗證，不動 Scanner / V4.4 / Action。</b><p class="muted">重點：TPEx transport 三路徑、TWSE 核心資料實值、FinMind 同股票同日期 cross-check。任何來源沒有可驗證日期就不硬判 Target Match。</p>
<label>上市 <input id="listed" value="2330"></label><label>上櫃 <input id="otc" value="5347"></label><label>Target <input id="target" value="2026-09-11"></label>
<button id="run">開始 Cross-check</button><span id="status" class="muted"></span></div>
<div class="box"><h2>結果</h2><table><thead><tr><th>市場</th><th>類別</th><th>來源</th><th>HTTP</th><th>日期</th><th>Target</th><th>股票</th><th>欄位/摘要</th><th>耗時</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="box"><h2>TPEx Transport 詳細</h2><pre id="transport" class="muted"></pre></div>
<script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function get(u){let t=performance.now();try{let r=await fetch(u,{cache:'no-store'}),x=await r.text(),j=null;try{j=JSON.parse(x)}catch{}return{ok:r.ok,status:r.status,j,text:x,ms:Math.round(performance.now()-t)}}catch(e){return{ok:false,status:'FETCH',j:null,text:String(e),ms:Math.round(performance.now()-t)}}}
function add(mkt,cat,src,r,date,match,summary,stock){let tr=document.createElement('tr');tr.innerHTML=`<td>${mkt}</td><td>${cat}</td><td>${src}</td><td class="${r.ok?'ok':'bad'}">${r.status}</td><td>${esc(date||'—')}</td><td class="${match===true?'ok':match===false?'bad':'warn'}">${match===true?'✓':match===false?'✗':'?'}</td><td>${esc(stock||'—')}</td><td>${esc(summary||'')}</td><td>${r.ms} ms</td>`;$('rows').appendChild(tr)}
function rowSummary(j){if(!j)return'';if(j.matched)return Object.entries(j.matched).slice(0,18).map(([k,v])=>`${k}=${v}`).join(' | ');return (j.keys||[]).slice(0,18).join(', ')}
async function official(source,path,code,cat,target){let r=await get(`/api/audit/endpoint?source=${source}&path=${encodeURIComponent(path)}&code=${code}`),d=r.j?.latest_date||null;add(source.toUpperCase(),cat,path,r,d,d?d===target:null,rowSummary(r.j),r.j?.matched?code:'—');return r}
async function fm(code,ds,cat,target,mkt){let r=await get(`/api/finmind?dataset=${ds}&data_id=${code}&start_date=${target}&end_date=${target}&_=${Date.now()}`),a=Array.isArray(r.j?.data)?r.j.data:[],d=a.map(x=>x.date).filter(Boolean).sort().at(-1)||null;add(mkt,cat,`FinMind ${ds}`,r,d,d?d===target:null,a.length?Object.entries(a.at(-1)).slice(0,18).map(([k,v])=>`${k}=${v}`).join(' | '):(r.j?.error||r.j?.msg||''),a.length?code:'—');return r}
$('run').onclick=async()=>{$('rows').innerHTML='';$('transport').textContent='';let L=$('listed').value.trim(),O=$('otc').value.trim(),T=$('target').value.trim();$('status').textContent='TWSE...';
for(const [p,c] of [['/exchangeReport/STOCK_DAY_ALL','價格'],['/exchangeReport/MI_MARGN','融資融券'],['/fund/T86','三大法人'],['/exchangeReport/TWTB4U','當沖/交易狀態'],['/SBL/TWT96U','借券'],['/exchangeReport/BWIBBU_ALL','估值']])await official('twse',p,L,c,T);
$('status').textContent='FinMind listed...';for(const [d,c] of [['TaiwanStockPrice','價格'],['TaiwanStockMarginPurchaseShortSale','融資融券'],['TaiwanStockInstitutionalInvestorsBuySell','三大法人'],['TaiwanStockDayTrading','當沖'],['TaiwanStockSecuritiesLending','借券']])await fm(L,d,c,T,'TWSE');
$('status').textContent='TPEx transport...';let tr=await get('/api/audit/tpex-transport?path=tpex_mainboard_daily_close_quotes');$('transport').textContent=JSON.stringify(tr.j||tr.text,null,2);for(const a of tr.j?.attempts||[])add('TPEX','Transport',a.upstream,{ok:Number(a.status)>=200&&Number(a.status)<400,status:a.status,ms:a.ms},null,null,`location=${a.location||'—'} | ${a.content_type||''} | ${a.preview||a.error||''}`,'—');
$('status').textContent='TPEx official candidates...';for(const [p,c] of [['/tpex_mainboard_daily_close_quotes','價格'],['/tpex_mainboard_margin_balance','融資融券'],['/tpex_3insti_daily_trading','三大法人'],['/tpex_intraday_trading_statistics','當沖'],['/tpex_margin_sbl','借券'],['/tpex_mainboard_peratio_analysis','估值']])await official('tpex',p,O,c,T);
$('status').textContent='FinMind OTC...';for(const [d,c] of [['TaiwanStockPrice','價格'],['TaiwanStockMarginPurchaseShortSale','融資融券'],['TaiwanStockInstitutionalInvestorsBuySell','三大法人'],['TaiwanStockDayTrading','當沖'],['TaiwanStockSecuritiesLending','借券']])await fm(O,d,c,T,'TPEX');
$('status').textContent='完成';};
</script><p style="text-align:center"><a href="/master-audit.html">One-click Master Audit｜V1.16.0-R10</a></p></body></html>
