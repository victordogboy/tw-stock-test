<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V1.16.0-R10｜All-Source / All-Dataset Audit｜基底 V1.14.2-R3</title>
<style>body{font-family:system-ui;background:#07111f;color:#eaf1ff;margin:18px}.box{background:#0d1b2e;border:1px solid #29415f;border-radius:12px;padding:14px;margin:12px 0}button,input{background:#10243d;color:#fff;border:1px solid #3a587e;border-radius:7px;padding:9px;margin:3px}.ok{color:#42db9b}.bad{color:#ff6f7e}.warn{color:#ffd36a}.muted{color:#9fb1cb}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px;border-bottom:1px solid #223957;text-align:left;vertical-align:top}.sticky{position:sticky;top:0;background:#0d1b2e}</style></head><body>
<h1>V1.16.0-R10｜All-Source / All-Dataset Audit</h1>
<div class="box"><b>一次完整普查。</b><p class="muted">TWSE / TPEx 全部可發現 GET API、Yahoo Daily+1m、FinMind catalog 全部台灣 datasets、TDCC、MOPS、TAIFEX。任何單項失敗只記錄，不中止整輪。FinMind 402 後其餘標 SKIP-QUOTA，避免浪費匿名額度。Scanner / V4.4 / Action 未修改。</p>
<label>上市 <input id="L" value="2330"></label><label>上櫃 <input id="O" value="5347"></label><label>Target <input id="T" value="2026-09-11"></label>
<button id="run">▶ 一鍵完整普查</button><button id="stop">停止</button><b id="status" class="muted"></b></div>
<div class="box"><h2>完整結果</h2><div style="overflow:auto;max-height:72vh"><table><thead class="sticky"><tr><th>#</th><th>來源</th><th>市場</th><th>Dataset/API</th><th>HTTP</th><th>日期</th><th>Target</th><th>筆數</th><th>耗時</th><th>摘要</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="box"><h2>自動總結</h2><pre id="summary" class="muted"></pre></div>
<script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let stop=false,N=0,R=[];
$('stop').onclick=()=>stop=true;
async function get(u,timeout=18000){let c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout),t=performance.now();try{let r=await fetch(u,{cache:'no-store',signal:c.signal}),x=await r.text(),j=null;try{j=JSON.parse(x)}catch{}return{ok:r.ok,status:r.status,j,text:x,ms:Math.round(performance.now()-t)}}catch(e){return{ok:false,status:e.name==='AbortError'?'TIMEOUT':'FETCH',j:null,text:String(e),ms:Math.round(performance.now()-t)}}finally{clearTimeout(tm)}}
function add(src,mkt,name,r,date,rows,sum){let T=$('T').value,m=date?date===T:null;R.push({src,mkt,name,status:r.status,date,rows,match:m,ms:r.ms});let tr=document.createElement('tr');tr.innerHTML=`<td>${++N}</td><td>${esc(src)}</td><td>${esc(mkt)}</td><td>${esc(name)}</td><td class="${r.ok?'ok':'bad'}">${esc(r.status)}</td><td>${esc(date||'—')}</td><td class="${m===true?'ok':m===false?'bad':'warn'}">${m===true?'✓':m===false?'✗':'?'}</td><td>${esc(rows??'—')}</td><td>${r.ms} ms</td><td>${esc(sum||'')}</td>`;$('rows').appendChild(tr)}
async function swagger(src){let r=await get(`/api/audit/swagger?source=${src}`);return r.j?.gets||[]}
async function endpoint(src,p,code){let r=await get(`/api/audit/endpoint?source=${src}&path=${encodeURIComponent(p)}&code=${code}`),j=r.j||{};add(src.toUpperCase(),src==='twse'?'上市':'上櫃',p,r,j.latest_date,j.rows,j.matched?Object.entries(j.matched).slice(0,12).map(([k,v])=>`${k}=${v}`).join(' | '):(j.error||j.keys?.slice(0,12).join(', ')));return r}
async function yahoo(code,mkt,int){let r=await get(`/api/audit/yahoo?code=${code}&market=${mkt}&interval=${int}`),j=r.j||{},d=j.last?.t?new Date(j.last.t*1000).toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'}):null;add('Yahoo',mkt==='twse'?'上市':'上櫃',`${code} ${int}`,r,d,j.rows,j.last?`O=${j.last.open} H=${j.last.high} L=${j.last.low} C=${j.last.close} V=${j.last.volume} state=${j.market_state||'—'}`:j.error)}
async function fm(code,mkt,ds){let T=$('T').value,r=await get(`/api/finmind?dataset=${encodeURIComponent(ds)}&data_id=${code}&start_date=2026-01-01&end_date=${T}&_=${Date.now()}`),a=Array.isArray(r.j?.data)?r.j.data:[],d=a.map(x=>x?.date).filter(Boolean).sort().at(-1)||null;add('FinMind',mkt,ds,r,d,a.length,a.length?Object.entries(a.at(-1)).slice(0,12).map(([k,v])=>`${k}=${v}`).join(' | '):(r.j?.error||r.j?.msg||''));return r.status===502&&/402|upper limit|quota/i.test(JSON.stringify(r.j||{}))}
async function official(name){let r=await get(`/api/audit/official-source?source=${name}`),j=r.j||{};add(name.toUpperCase(),'官方來源','Reachability',r,null,null,`upstream=${j.status||r.status} location=${j.location||'—'} bytes=${j.bytes||0} ${j.error||''}`)}
$('run').onclick=async()=>{stop=false;N=0;R=[];$('rows').innerHTML='';$('summary').textContent='';let L=$('L').value.trim(),O=$('O').value.trim(),step=0;const st=x=>$('status').textContent=`${++step}｜${x}`;
for(const src of ['twse','tpex']){if(stop)break;st(`${src.toUpperCase()} discovery`);let list=await swagger(src),code=src==='twse'?L:O;for(let i=0;i<list.length;i++){if(stop)break;st(`${src.toUpperCase()} ${i+1}/${list.length} ${list[i].path}`);await endpoint(src,list[i].path,code)}}
if(!stop){for(const [c,m] of [[L,'twse'],[O,'tpex']])for(const int of ['1d','1m']){st(`Yahoo ${c} ${int}`);await yahoo(c,m,int)}}
if(!stop){st('TPEx transport');let tr=await get('/api/audit/tpex-transport?path=tpex_mainboard_daily_close_quotes');for(const a of tr.j?.attempts||[])add('TPEx Transport','上櫃',a.upstream,{ok:Number(a.status)>=200&&Number(a.status)<400,status:a.status,ms:a.ms},null,null,`location=${a.location||'—'} ${a.preview||a.error||''}`)}
let quota=false;
if(!stop){st('FinMind catalog');let cat=await get('/api/audit/finmind-catalog'),ds=cat.j?.datasets||[];add('FinMind','台灣市場','Catalog',cat,null,ds.length,cat.j?.ok?`catalog=${ds.length}`:(cat.j?.error||''));for(const [code,mkt] of [[L,'上市'],[O,'上櫃']])for(let i=0;i<ds.length;i++){if(stop)break;if(quota){add('FinMind',mkt,ds[i],{ok:false,status:'SKIP-QUOTA',ms:0},null,null,'匿名 quota 已達上限');continue}st(`FinMind ${mkt} ${i+1}/${ds.length} ${ds[i]}`);quota=await fm(code,mkt,ds[i]);await new Promise(r=>setTimeout(r,130))}}
if(!stop)for(const x of ['tdcc','mops','taifex']){st(x.toUpperCase());await official(x)}
let ok=R.filter(x=>String(x.status)==='200').length,hit=R.filter(x=>x.match===true).length,old=R.filter(x=>x.match===false).length,unknown=R.filter(x=>x.match===null).length,fail=R.filter(x=>!['200','SKIP-QUOTA'].includes(String(x.status))).length,skip=R.filter(x=>String(x.status)==='SKIP-QUOTA').length;
$('summary').textContent=`測試列總數：${R.length}\nHTTP 200：${ok}\nTarget 命中：${hit}\n可驗證但日期落後：${old}\n日期不可驗證：${unknown}\nHTTP/FETCH/TIMEOUT 失敗：${fail}\nFinMind quota 跳過：${skip}\n\n判讀原則：? 不代表過期；只代表此回傳無法可靠辨識日期。任何資料都不自行 stamp Target Date。`;
$('status').textContent=stop?'已停止':'✓ 完整普查結束';};
</script></body></html>
