<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股 V1.4.3 · V4.4 Mapping 修正版</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1020;color:#eaf0ff;margin:0}
main{max-width:1200px;margin:auto;padding:22px}.card{background:#141b2f;border:1px solid #2b3858;border-radius:14px;padding:15px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
button,input{padding:10px;border-radius:9px;border:1px solid #394969}button{font-weight:800;cursor:pointer}
input{background:#0d1425;color:white;width:100%;box-sizing:border-box}.muted{color:#9eb0d1}.good{color:#65d99a}.bad{color:#ff7777}
progress{width:100%;height:18px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #273451;text-align:right}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.pill{padding:3px 7px;border-radius:999px;background:#253454}
.tabs button{width:auto;margin-right:6px}.small{font-size:12px}.warn{color:#ffd166}
</style></head><body><main>
<h1>台股 V1.4.3 · V4.4 Mapping 修正版</h1>
<p class="muted">TWSE 免費全市場 → 成交量先篩 → Yahoo 約 300 日 OHLCV → 正式 V4.4 Opportunity / Entry / Hold / Persistence。TPEx 暫不阻塞主線。</p>

<div class="card grid">
<div><label>最低股價</label><input id="minClose" type="number" value="10"></div>
<div><label>最低成交量（張）</label><input id="minLots" type="number" value="3000"></div>
<div><label>最大掃描檔數</label><input id="maxStocks" type="number" value="200"></div>
<div><label>同時請求數</label><input id="concurrency" type="number" min="1" max="8" value="4"></div>
</div>
<div class="card">
<button id="scanBtn">開始 TWSE V4.4 掃描</button>
<button id="stopBtn">停止</button>
<div id="status" class="muted" style="margin-top:10px">尚未開始</div>
<progress id="prog" max="100" value="0"></progress>
<div id="stats" class="small muted"></div>
</div>
<div class="card">
<div class="tabs">
<button onclick="showRank('overall')">綜合 TOP</button>
<button onclick="showRank('opportunity')">Opportunity</button>
<button onclick="showRank('entry')">Entry</button>
<button onclick="showRank('bottom')">Bottom</button>
<button onclick="showRank('ignition')">Ignition</button>
<button onclick="showRank('trend')">Trend</button>
</div>
<div style="overflow:auto"><table><thead><tr>
<th>代號</th><th>名稱</th><th>收盤</th><th>Setup</th><th>Opp.</th><th>Entry</th><th>Hold</th><th>Persist.</th><th>Bottom</th><th>Ignition</th><th>Trend</th><th>狀態</th>
</tr></thead><tbody id="rows"></tbody></table></div>
</div>
<div class="card">
<h3>V4.4 Mapping 診斷 / 單股回歸</h3>
<div class="grid">
<div><label>股票代號</label><input id="diagCode" value="3443"></div>
<div><label>截止日期（Strict No-Lookahead）</label><input id="diagDate" type="date" value="2026-08-11"></div>
</div>
<button id="diagBtn">執行 3443 V4.4 原始輸出診斷</button>
<div id="diagSummary" class="small muted" style="margin-top:8px">尚未執行</div>
<pre id="diagRaw" style="white-space:pre-wrap;max-height:520px;overflow:auto;background:#0a0f1d;padding:12px;border-radius:10px;font-size:12px"></pre>
</div>
<div class="card"><b>錯誤 / 略過</b><div id="errors" class="small muted">—</div></div>
<script src="/v44-engine.js"></script>
<script>
const $=id=>document.getElementById(id);
let stopped=false, results=[], errors=[], currentRank='overall';
async function getJSON(url){
 const r=await fetch(url,{cache:'no-store'});
 const j=await r.json().catch(()=>({ok:false,error:'non-json'}));
 if(!r.ok||j.ok===false) throw new Error(j.error||('HTTP '+r.status));
 return j;
}
function n(v,d=0){v=Number(v);return Number.isFinite(v)?v:d}
function fallbackScore(hist){
 const c=hist.at(-1)?.close||0, p=hist.at(-2)?.close||c;
 const ret=p?((c/p)-1)*100:0;
 const ma=k=>hist.slice(-k).reduce((a,x)=>a+n(x.close),0)/Math.min(k,hist.length);
 const m5=ma(5),m10=ma(10),m20=ma(20);
 const trend=(c>m5?20:0)+(m5>m10?25:0)+(m10>m20?25:0)+(ret>0?15:0)+Math.min(15,Math.max(0,ret*2));
 return {setup:Math.round(trend),opportunity:Math.round(trend),entry:Math.round(trend*.8),hold:Math.round(trend),persistence:0,bottom:0,ignition:Math.round(trend),trend:Math.round(trend),state:'fallback'};
}
function findKey(obj,names,depth=0){
 if(obj==null||depth>4)return undefined;
 for(const k of Object.keys(obj)){
   if(names.includes(k.toLowerCase())) return obj[k];
 }
 for(const v of Object.values(obj)){
   if(v && typeof v==='object' && !Array.isArray(v)){
     const z=findKey(v,names,depth+1); if(z!==undefined)return z;
   }
 }
}
function formalObjects(hist){
 const rows=hist.map(x=>({date:x.date,open:n(x.open),high:n(x.high),low:n(x.low),close:n(x.close),volume:n(x.volume)}));
 if(typeof combineScores!=='function'||typeof entryEngine!=='function') throw new Error('V4.4 engine functions missing');
 const R=combineScores(rows,[],[],[]);
 const E=entryEngine(rows,R);
 return {rows,R,E};
}
function scoreOf(v){
 if(Number.isFinite(Number(v))) return Number(v);
 if(v && typeof v==='object'){
   for(const k of ['score','total','value']){
     if(Number.isFinite(Number(v[k]))) return Number(v[k]);
   }
 }
 return 0;
}
function formalScore(hist){
 try{
   const {R,E}=formalObjects(hist);
   return {
     setup:scoreOf(R?.setup),
     opportunity:scoreOf(E?.opportunity ?? E?.opportunityScore),
     entry:scoreOf(E?.score ?? E?.entryScore),
     hold:scoreOf(E?.hold ?? E?.holdScore),
     persistence:scoreOf(E?.persistence ?? E?.persistenceScore),
     bottom:scoreOf(R?.bottom),
     ignition:scoreOf(R?.ignition),
     trend:scoreOf(R?.market),
     state:E?.state ?? R?.state ?? ''
   };
 }catch(e){ return fallbackScore(hist); }
}
function rankVal(r,key){
 if(key==='overall') return r.entry*.42+r.opportunity*.28+r.hold*.15+r.persistence*.15;
 return n(r[key]);
}
function showRank(key=currentRank){
 currentRank=key;
 const a=[...results].sort((x,y)=>rankVal(y,key)-rankVal(x,key)).slice(0,50);
 $('rows').innerHTML=a.map(r=>`<tr><td>${r.code}</td><td>${r.name}</td><td>${r.close}</td>
 <td>${r.setup}</td><td>${r.opportunity}</td><td><b>${r.entry}</b></td><td>${r.hold}</td><td>${r.persistence}</td>
 <td>${r.bottom}</td><td>${r.ignition}</td><td>${r.trend}</td><td><span class="pill">${r.state||''}</span></td></tr>`).join('');
}
async function worker(item){
 if(stopped)return;
 try{
  const end=new Date().toLocaleDateString('sv-SE');
  const start=new Date(Date.now()-470*864e5).toLocaleDateString('sv-SE');
  const j=await getJSON(`/api/history/auto?code=${encodeURIComponent(item.code)}&market=twse&start_date=${start}&end_date=${end}`);
  if((j.data||[]).length<180) throw new Error('歷史K不足 '+(j.data||[]).length);
  const s=formalScore(j.data);
  results.push({...item,...s,historyCount:j.data.length,historySource:j.source});
 }catch(e){errors.push(`${item.code} ${item.name}: ${e.message}`)}
}
async function runPool(items,limit){
 let idx=0,done=0;
 async function lane(){
  while(!stopped){
   const i=idx++; if(i>=items.length)return;
   await worker(items[i]); done++;
   $('prog').value=Math.round(done/items.length*100);
   $('status').textContent=`掃描中 ${done}/${items.length} · 成功 ${results.length} · 略過 ${errors.length}`;
   if(done%5===0){showRank();$('errors').textContent=errors.slice(-20).join(' | ')||'—'}
   await new Promise(r=>setTimeout(r,180));
  }
 }
 await Promise.all(Array.from({length:limit},lane));
}
$('scanBtn').onclick=async()=>{
 stopped=false;results=[];errors=[];$('prog').value=0;
 try{
  $('status').textContent='取得 TWSE 成交量候選股…';
  const minClose=n($('minClose').value,10),minLots=n($('minLots').value,3000),max=n($('maxStocks').value,200);
  const j=await getJSON(`/api/market/filter?min_close=${minClose}&min_lots=${minLots}`);
  let cand=(j.data||[]).filter(x=>x.market==='twse').slice(0,max);
  $('stats').textContent=`候選 ${cand.length} 檔；來源 TWSE ${j.sources?.twse?.ok?'✓':'✗'} / TPEx ${j.sources?.tpex?.ok?'✓':'✗'}；V4.4 engine ${typeof entryEngine==='function'?'已載入':'fallback'}`;
  await runPool(cand,Math.max(1,Math.min(8,n($('concurrency').value,4))));
  showRank();
  $('errors').textContent=errors.slice(-30).join(' | ')||'—';
  $('status').textContent=stopped?`已停止 · 完成 ${results.length} 檔`:`完成 · 成功 ${results.length} 檔 · 略過 ${errors.length} 檔`;
 }catch(e){$('status').innerHTML='<span class="bad">'+e.message+'</span>'}
};
$('stopBtn').onclick=()=>{stopped=true;$('status').textContent='正在停止…'};

$('diagBtn').onclick=async()=>{
 const code=$('diagCode').value.trim(),cut=$('diagDate').value;
 $('diagSummary').textContent='讀取歷史資料…'; $('diagRaw').textContent='';
 try{
   const start=new Date(new Date(cut+'T12:00:00').getTime()-500*864e5).toLocaleDateString('sv-SE');
   const j=await getJSON(`/api/history/auto?code=${encodeURIComponent(code)}&market=twse&start_date=${start}&end_date=${cut}`);
   const hist=(j.data||[]).filter(x=>x.date<=cut);
   const {R,E}=formalObjects(hist);
   const mapped=formalScore(hist);
   const engineMap={
     setup_raw:R?.setup,
     market_raw:R?.market,
     bottom_raw:R?.bottom,
     ignition_raw:R?.ignition,
     entry_score:E?.score,
     opportunity:E?.opportunity ?? E?.opportunityScore,
     hold:E?.hold ?? E?.holdScore,
     persistence:E?.persistence ?? E?.persistenceScore
   };
   $('diagSummary').innerHTML=`<span class="good">${code} · ${cut} · ${hist.length} 日</span> · mapped: Setup ${mapped.setup} / Opp ${mapped.opportunity} / Entry ${mapped.entry} / Hold ${mapped.hold} / Persist ${mapped.persistence} / Bottom ${mapped.bottom} / Ignition ${mapped.ignition} / Trend ${mapped.trend}`;
   $('diagRaw').textContent=JSON.stringify({
      engineFunctions:{combineScores:typeof combineScores,entryEngine:typeof entryEngine},
      lastBar:hist.at(-1),
      mapped,
      engineMap,
      combineScores_keys:Object.keys(R||{}),
      entryEngine_keys:Object.keys(E||{}),
      combineScores:R,
      entryEngine:E
   },null,2);
 }catch(e){
   $('diagSummary').innerHTML='<span class="bad">'+e.message+'</span>';
 }
};
</script></main></body></html>
