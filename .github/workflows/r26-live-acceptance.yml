name: R26 continuation regression and live deploy acceptance
on:
  push:
    branches: [main]
    paths:
      - 'public/r26-live-monitor.mjs'
      - 'public/r26-engine/calendar-2026.mjs'
      - 'public/r26-engine/backfill-plan.mjs'
      - 'tests/r26-calendar-2026.test.mjs'
      - 'tests/r26-backfill-plan.test.mjs'
      - '.github/workflows/r26-live-acceptance.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ESM syntax and historical replay tests
        run: |
          node --check public/r26-live-monitor.mjs
          node --check public/r26-engine/calendar-2026.mjs
          node --check public/r26-engine/backfill-plan.mjs
          node --test tests/r26-calendar-2026.test.mjs tests/r26-backfill-plan.test.mjs tests/r26-live-engine.test.mjs
  live:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Cloudflare actually serves the R26 patch
        env:
          ROOT: https://tw-stock-api.victordogboy.workers.dev
        run: |
          set -euo pipefail
          good=0
          for attempt in $(seq 1 24); do
            page=$(curl -sSL --max-time 15 -o /tmp/r26-page -w '%{http_code}' "$ROOT/r26-monitor.html?verify=$GITHUB_SHA" || true)
            js=$(curl -sSL --max-time 15 -o /tmp/r26-live -w '%{http_code}' "$ROOT/r26-live-monitor.mjs?verify=$GITHUB_SHA" || true)
            calendar=$(curl -sSL --max-time 15 -o /tmp/r26-calendar -w '%{http_code}' "$ROOT/r26-engine/calendar-2026.mjs?verify=$GITHUB_SHA" || true)
            planner=$(curl -sSL --max-time 15 -o /tmp/r26-backfill -w '%{http_code}' "$ROOT/r26-engine/backfill-plan.mjs?verify=$GITHUB_SHA" || true)
            health=$(curl -sSL --max-time 15 -o /tmp/r26-health -w '%{http_code}' "$ROOT/api/r26/health" || true)
            echo "attempt $attempt: PAGE=$page JS=$js CALENDAR=$calendar PLANNER=$planner HEALTH=$health"
            if [[ $page == 200 && $js == 200 && $calendar == 200 && $planner == 200 && $health == 200 ]] &&
             grep -q 'extendTaifexCalendar2026(seed.calendar)' /tmp/r26-live &&
             grep -q 'pendingR26OfficialDownloads(sessions,rows)' /tmp/r26-live &&
             grep -q '20261111-taifex-2026-physical-session' /tmp/r26-calendar &&
             grep -q 'physicalFinMindDates(date)' /tmp/r26-live; then
              good=1;break
            fi
            sleep 10
          done
          [[ $good == 1 ]] || { echo 'R26 Cloudflare deploy is not verified'; exit 1; }
          echo 'R26 assets and API are live. NOTE: no current signal can be claimed until minute data and replay pass.'
