name: R26 risk circuit neighborhood and cost-slippage audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-risk-neighborhood-validation.yml'
      - 'scripts/r26-risk-neighborhood-validation.mjs'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify historical trading simulation + neighborhood, cost and stop-slippage
        run: node scripts/r26-risk-neighborhood-validation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-risk-neighborhood-validation
          path: r26-study-output/
          retention-days: 30
