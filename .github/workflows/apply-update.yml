name: Apply update.zip

on:
  push:
    branches:
      - main
    paths:
      - update.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-update-zip
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify update.zip
        shell: bash
        run: |
          set -euo pipefail
          test -f update.zip
          unzip -t update.zip

      - name: Apply update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tw-stock-update
          mkdir -p /tmp/tw-stock-update
          unzip -oq update.zip -d /tmp/tw-stock-update

          if find /tmp/tw-stock-update -type l | grep -q .; then
            echo "Symlinks are not allowed in update.zip"
            exit 1
          fi

          cp -a /tmp/tw-stock-update/. .

      - name: Commit applied files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- update.zip

          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
            exit 0
          fi

          git commit -m "Apply update.zip automatically"
          git push
