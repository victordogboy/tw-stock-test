name: R26 frozen two TX prefix no future data audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-frozen2tx-causal-prefix.yml'
      - 'scripts/r26-frozen2tx-causal-prefix.mjs'
  workflow_dispatch:
jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute nine historical R26 prefixes and reject changed past features or signals
        run: |
          node --check scripts/r26-frozen2tx-causal-prefix.mjs
          node scripts/r26-frozen2tx-causal-prefix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-frozen2tx-causal-prefix
          path: r26-study-output/
          retention-days: 30
