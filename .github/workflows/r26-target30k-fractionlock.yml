name: R26 30k net and 35 profit drawdown ratio with one-minute profit lock
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-target30k-fractionlock.yml'
      - 'scripts/r26-target30k-fractionlock.mjs'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Golden baseline and no-lookahead next-minute fraction stop x 756 configs
        run: |
          node --check scripts/r26-target30k-fractionlock.mjs
          node scripts/r26-target30k-fractionlock.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-target30k-fractionlock
          path: r26-study-output/
          retention-days: 30
