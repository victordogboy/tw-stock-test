name: FC23 latest data and original engine refresh
on:
  push:
    branches: [main]
    paths:
      - 'src/fc23/**'
      - 'scripts/refresh-fc23.mjs'
      - 'public/r1494a/fc23/shared-seed.b64'
      - '.github/workflows/fc23-refresh.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 11 * * *'
    - cron: '25 14,22 * * *'
concurrency:
  group: fc23-daily-original-engine
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fetch complete market data and advance FC23 own account
        run: node scripts/refresh-fc23.mjs
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: Publish verified FC23 latest state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set -euo pipefail
          if [ ! -f public/r1494a/fc23/live-bootstrap.b64 ]; then exit 0; fi
          # Preserve this job's verified outputs, then publish them onto the
          # current main tree. Never rebase a stale generated snapshot commit.
          tmpdir=$(mktemp -d)
          cp public/r1494a/fc23/live-bootstrap.b64 "$tmpdir/live-bootstrap.b64"
          cp public/r1494a/fc23/refresh-report.json "$tmpdir/refresh-report.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmpdir/live-bootstrap.b64" public/r1494a/fc23/live-bootstrap.b64
            cp "$tmpdir/refresh-report.json" public/r1494a/fc23/refresh-report.json
            git add public/r1494a/fc23/live-bootstrap.b64 public/r1494a/fc23/refresh-report.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh FC23 prices, own holdings, NAV and next-session plan'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'FC23 publish retry limit reached' >&2
          exit 1
