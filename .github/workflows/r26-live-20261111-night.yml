name: R26 Nov11 night strict real-tape replay
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-live-20261111-night.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Replay real official ZIP to Nov11 day and verified named TX202611 night bars
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import z from 'node:zlib';
          import {run,audit} from './public/r26-engine/engine.mjs';
          import {replayLive,mergeRecords,parseOfficialZip} from './public/r26-engine/live.mjs';
          import {extendTaifexCalendar2026} from './public/r26-engine/calendar-2026.mjs';
          const dir='./public/r26-engine/data/';
          const meta=JSON.parse(z.gunzipSync(fs.readFileSync(dir+'manifest.json.gz')));
          const raw=z.gunzipSync(Buffer.concat(meta.compressedParts.map(n=>fs.readFileSync(dir+n))));
          const bars=new Int32Array(raw.buffer,raw.byteOffset,raw.length/4);
          if(!audit(run(meta,bars,{end:meta.end}),meta).pass)throw Error('R26_FROZEN_PARITY_FAIL');
          const seed=JSON.parse(z.gunzipSync(fs.readFileSync(dir+'recent.json.gz')));
          const calendar=extendTaifexCalendar2026(seed.calendar);
          const root='https://tw-stock-api.victordogboy.workers.dev';
          const tradeDays=calendar.filter(d=>d>'2026-10-22'&&d<='2026-11-11');
          let records=seed.rows.slice(),official=[];
          for(const date of tradeDays){
            const url=root+'/api/r26/official-zip?date='+date+'&contract=202611';
            const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error('OFFICIAL_'+date+'_HTTP_'+response.status);
            const data=await parseOfficialZip(await response.arrayBuffer(),date,'202611');
            records=mergeRecords(records,data);
            const n=data.filter(x=>x.session_key==='night:'+calendar[calendar.indexOf(date)-1]).length;
            const d=data.filter(x=>x.session_key==='day:'+date).length;
            if(d!==300||n<780)throw Error('OFFICIAL_'+date+'_BAD_COVERAGE_N_'+n+'_D_'+d);
            official.push({date,night:n,day:d});
          }
          const response=await fetch(root+'/api/r26/intraday?contract=202611',{signal:AbortSignal.timeout(20000)});
          if(!response.ok)throw Error('NAMED_MONTH_'+response.status);
          const vendor=await response.json();
          const now=Date.now(),vendorCurrent=vendor.data.filter(x=>x.session_key==='night:2026-11-11');
          const first=vendorCurrent[0]?.timestamp_tpe,last=vendorCurrent.at(-1)?.timestamp_tpe;
          records=mergeRecords(records,vendor.data);
          const replay=replayLive(meta,bars,records,calendar,now),s=replay.session,row=replay.row;
          const report={created:new Date(now).toISOString(),time_tpe:new Date(now+8*3600000).toISOString().slice(0,19),
            official,official_count:official.length,current_vendor_bars:vendorCurrent.length,
            vendor_first:first,vendor_last:last,current_data_source:vendor.source,
            ready:replay.ready,model_position_confirmed:replay.positionConfirmed,
            issues:replay.issues,sessionStates:replay.sessionStates.slice(-3),
            added_sessions:replay.added,as_of:replay.as_of,session_date:s?.date,
            session_sid:s?.sid,session_contract:s?.contract,model_row:row,
            events:replay.events,model_stop:replay.stop,shadowPreviousTwo:replay.shadowPreviousTwo,
            fresh_minutes:replay.ageMinutes,newPnl:replay.newPnl,total:replay.total,
            warning:'Model paper portfolio only. Not confirmed user broker holdings. Never place orders from an unverified result.'};
          fs.writeFileSync('r26-nov11-night.json',JSON.stringify(report,null,2));
          console.log('R26_TONIGHT_VERIFIED',JSON.stringify(report));
          if(!replay.ready||!replay.positionConfirmed)throw Error('R26_TONIGHT_FAIL_CLOSED');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-nov11-night-snapshot
          path: r26-nov11-night.json
