name: C26 FinMind forward data coverage and immutable-overlap gate
on:
  workflow_dispatch:
  schedule:
    - cron: '50 13 * * 1-5'
    - cron: '30 1 * * 2-6'
  push:
    branches: [main]
    paths:
      - 'research/c26-lock/forward/**'
      - 'tests/c26-forward-stage.test.mjs'
      - 'tests/c26-github-oidc.test.mjs'
      - 'src/c26/github-oidc.mjs'
      - 'src/c26/private-feed.mjs'
      - '.github/workflows/c26-forward-eod.yml'
permissions:
  contents: write
  id-token: write # GitHub-signed, short-lived identity for Cloudflare private storage
concurrency:
  group: c26-eod-finmind-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate script and archive fingerprint
        run: |
          node --check research/c26-lock/forward/stage-finmind.mjs
          node --check research/c26-lock/forward/diagnose-rotation.mjs
          node --check research/c26-lock/forward/sync-private-store.mjs
          node --check src/c26/github-oidc.mjs
          node --check src/c26/private-feed.mjs
          node --test tests/c26-forward-stage.test.mjs tests/c26-github-oidc.test.mjs tests/c26-private-feed.test.mjs
      - name: Restore private source cache when configured
        id: restore
        continue-on-error: true
        run: node research/c26-lock/forward/sync-private-store.mjs restore
      - name: Fetch FinMind full-market EOD (NO TOKEN IN LOGS)
        id: ingest
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -euo pipefail
          node research/c26-lock/forward/stage-finmind.mjs
          node research/c26-lock/forward/audit-chip-overlap.mjs
          node --test tests/c26-forward-stage.test.mjs tests/c26-chip-overlap.test.mjs
      - name: Publish candidate-screen diagnostics only (never raw FinMind or a trade order)
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        run: node research/c26-lock/forward/diagnose-rotation.mjs
      - name: Persist and verify private source cache
        id: persist
        continue-on-error: true
        run: |
          node research/c26-lock/forward/sync-private-store.mjs publish
          node research/c26-lock/forward/sync-private-store.mjs status
      - name: Publish coverage summary ONLY (FinMind raw data stays private)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tmpdir=$(mktemp -d)
          cp public/r1494a/c26/data/forward-status.json "$tmpdir/forward-status.json"
          cp public/r1494a/c26/data/forward-chip-parity.json "$tmpdir/forward-chip-parity.json"
          if [ -f public/r1494a/c26/data/rotation-diagnostic.json ]; then cp public/r1494a/c26/data/rotation-diagnostic.json "$tmpdir/rotation-diagnostic.json"; fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmpdir/forward-status.json" public/r1494a/c26/data/forward-status.json
            cp "$tmpdir/forward-chip-parity.json" public/r1494a/c26/data/forward-chip-parity.json
            if [ -f "$tmpdir/rotation-diagnostic.json" ]; then cp "$tmpdir/rotation-diagnostic.json" public/r1494a/c26/data/rotation-diagnostic.json; fi
            git add public/r1494a/c26/data/forward-status.json public/r1494a/c26/data/forward-chip-parity.json
            if [ -f public/r1494a/c26/data/rotation-diagnostic.json ]; then git add public/r1494a/c26/data/rotation-diagnostic.json; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Stage FinMind forward C26 source data (trading plan remains blocked)'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'C26 source publish failed after retry' >&2
          exit 1
      - name: Report storage failure without discarding source coverage
        if: steps.persist.outcome == 'failure'
        run: |
          echo '::error::Source coverage updated, but private persistence failed. Check GitHub OIDC trust and Worker SCAN_JOBS; current C26 trading remains blocked.'
          exit 1
