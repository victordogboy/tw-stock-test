name: C26 automatic original-engine replay and next-session plan
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '50 13 * * 1-5'
    - cron: '30 23 * * 0-4'
  push:
    branches: [main]
    paths:
      - 'research/c26-lock/forward/**'
      - 'research/a56-live/**'
      - 'research/c30-live/**'
      - 'public/r1494a/c30/runtime-manifest.json'
      - 'tests/c26-forward-stage.test.mjs'
      - 'tests/a56-refresh*.test.mjs'
      - 'src/c26/a56-refresh.mjs'
      - 'tests/c26-github-oidc.test.mjs'
      - 'src/c26/github-oidc.mjs'
      - 'src/c26/private-feed.mjs'
      - '.github/workflows/c26-forward-eod.yml'
permissions:
  contents: write
  id-token: write # GitHub-signed, short-lived identity for Cloudflare private storage
concurrency:
  group: c26-eod-finmind-staging
  cancel-in-progress: false
jobs:
  requested:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {refreshDecision} from './research/a56-live/refresh-needed.mjs';
          const read=async path=>{
            try{const r=await fetch('https://tw-stock-api.victordogboy.workers.dev'+path,{cache:'no-store',signal:AbortSignal.timeout(20000)});return r.ok?await r.json():null}catch{return null}
          };
          const [queue,status]=await Promise.all([read('/api/c26/a56/refresh-status'),read('/api/c26/a56/status')]);
          const readJson=path=>JSON.parse(fs.readFileSync(path,'utf8'));
          const coverage=readJson('public/r1494a/c26/data/forward-status.json');
          const c30Plan=readJson('public/r1494a/c30/verified-forward.json');
          const c30={signalDate:c30Plan.signal_date,sourceDate:coverage.full_market_last_verified};
          const decision=refreshDecision({event:process.env.EVENT_NAME,cron:process.env.CRON,queue,status,c30});
          console.log('A56_REFRESH_DECISION',JSON.stringify(decision));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'proceed='+decision.proceed+'\n');
          JS
  stage:
    needs: requested
    if: needs.requested.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate script and archive fingerprint
        run: |
          node --test tests/a56-refresh-needed.test.mjs tests/a56-refresh.test.mjs tests/a56-status-expiry.test.mjs tests/a56-continuation.test.mjs
          node --check research/c26-lock/forward/stage-finmind.mjs
          node --check research/c26-lock/forward/diagnose-rotation.mjs
          node --check research/c26-lock/forward/sync-private-store.mjs
          node --check src/c26/github-oidc.mjs
          node --check src/c26/private-feed.mjs
          node --test tests/c26-forward-stage.test.mjs tests/c26-github-oidc.test.mjs tests/c26-private-feed.test.mjs
      - name: Restore private source cache when configured
        id: restore
        continue-on-error: true
        run: node research/c26-lock/forward/sync-private-store.mjs restore
      - name: Mark requested A56 update running
        continue-on-error: true
        run: node research/a56-live/workflow-queue.mjs begin
      - name: Fetch FinMind full-market EOD (NO TOKEN IN LOGS)
        id: ingest
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -euo pipefail
          node research/c26-lock/forward/stage-finmind.mjs
          node research/c26-lock/forward/audit-chip-overlap.mjs
          node --test tests/c26-forward-stage.test.mjs tests/c26-chip-overlap.test.mjs
      - name: Publish candidate-screen diagnostics only (never raw FinMind or a trade order)
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        run: node research/c26-lock/forward/diagnose-rotation.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numeric runtime
        run: |
          python -m pip install numpy==2.3.5 pandas==2.2.3
          python -m unittest discover -s research/a56-live -p test_minute_requirement.py -v
      - name: Replay SHA-locked original C26 and audit cash, inventory and T+1 decisions
        id: model
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -euo pipefail
          node research/c26-lock/forward/restore-runtime.mjs
          python research/c26-lock/forward/fetch-market.py
          node research/c26-lock/forward/build-contexts.mjs
          python research/c26-lock/forward/replay-forward.py
          node --test tests/c26-verified-forward.test.mjs tests/c26-next-session-plan-gate.test.mjs
      - name: Continue the independent A56 combined account and freeze next-session plan
        id: a56model
        if: steps.model.outcome == 'success'
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python research/a56-live/run_forward.py
      - name: Continue the independent C30 RISK23 account
        id: c30model
        if: steps.model.outcome == 'success'
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p='public/r1494a/c30/verified-forward.json';
          const coverage=JSON.parse(fs.readFileSync('public/r1494a/c26/data/forward-status.json'));
          const previous=fs.existsSync(p)?JSON.parse(fs.readFileSync(p)):null;
          process.exit(process.env.RUN_EVENT==='schedule' && previous?.signal_date>=coverage.full_market_last_verified ? 0:1);
          JS
          then
            echo 'C30 plan already verified through this closing session'
          else
            bash research/c30-live/run-forward.sh
          fi
      - name: Persist and verify private source cache
        id: persist
        continue-on-error: true
        run: |
          node research/c26-lock/forward/sync-private-store.mjs publish
          node research/c26-lock/forward/sync-private-store.mjs status
      - name: Publish audited model atomically; retain previous model on replay failure
        id: publication
        env:
          MODEL_OUTCOME: ${{ steps.model.outcome }}
          A56_OUTCOME: ${{ steps.a56model.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tmpdir=$(mktemp -d)
          files=(forward-status.json forward-chip-parity.json)
          if [ -f public/r1494a/c26/data/rotation-diagnostic.json ]; then files+=(rotation-diagnostic.json); fi
          if [ "$MODEL_OUTCOME" = success ]; then files+=(forward-replay.json verified-next-day-plan.json forward-replay-audit.json); fi
          for file in "${files[@]}"; do cp "public/r1494a/c26/data/$file" "$tmpdir/$file"; done
          if [ "$A56_OUTCOME" = success ]; then
            cp public/r1494a/c26/a56/forward.json "$tmpdir/a56-forward.json"
            cp public/r1494a/c26/a56/latest-manifest.json "$tmpdir/a56-latest-manifest.json"
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do
              cp "$tmpdir/$file" "public/r1494a/c26/data/$file"
              git add "public/r1494a/c26/data/$file"
            done
            if [ "$A56_OUTCOME" = success ]; then
              cp "$tmpdir/a56-forward.json" public/r1494a/c26/a56/forward.json
              cp "$tmpdir/a56-latest-manifest.json" public/r1494a/c26/a56/latest-manifest.json
              git add public/r1494a/c26/a56/forward.json public/r1494a/c26/a56/latest-manifest.json
            fi
            if [ -f .c26-private/c30-verified-forward.json ]; then
              node --input-type=module <<'JS'
          import fs from 'node:fs';
          const destination='public/r1494a/c30/verified-forward.json';
          const pending=JSON.parse(fs.readFileSync('.c26-private/c30-verified-forward.json'));
          const current=fs.existsSync(destination)?JSON.parse(fs.readFileSync(destination)):null;
          if(pending.readiness!=='verified_replay'||pending.no_execution_prices!==true)throw Error('C30 report not verified');
          if(!current||pending.signal_date>current.signal_date)fs.copyFileSync('.c26-private/c30-verified-forward.json',destination);
          JS
              git add public/r1494a/c30/verified-forward.json
            fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update C26 source and audited model (replay: $MODEL_OUTCOME)"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'C26 source publish failed after retry' >&2
          exit 1
      - name: Complete A56 requested update status
        if: always()
        continue-on-error: true
        env:
          A56_OUTCOME: ${{ steps.a56model.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        run: node research/a56-live/workflow-queue.mjs finish
      - name: Report A56 replay failure without publishing an unverified plan
        if: steps.a56model.outcome == 'failure'
        run: |
          echo '::error::A56 combined-account replay failed. Prior verified A56 inventory retained; see the failed replay step.'
          exit 1
      - name: Report C30 replay failure with the last verified plan retained
        if: steps.c30model.outcome == 'failure'
        run: |
          echo '::error::C30 original-engine replay failed. The prior verified C30 plan was retained.'
          exit 1
      - name: Report storage failure without discarding source coverage
        if: steps.persist.outcome == 'failure'
        run: |
          echo '::error::Source coverage updated, but private persistence failed. Check GitHub OIDC trust and Worker SCAN_JOBS; current C26 trading remains blocked.'
          exit 1
      - name: Report replay failure with last verified inventory retained
        if: steps.model.outcome == 'failure'
        run: |
          echo '::error::C26 replay failed. Source diagnostics and previous verified model retained; no new trade plan published.'
          exit 1

