name: R26 keep existing trend LONG vs ATR forced exit under1000 DD
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-incumbent-long-rescue.yml'
      - 'scripts/r26-incumbent-long-rescue.mjs'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact R26 baseline and compare preserve vs force exit in high ATR across 674 historical 1m tests
        run: |
          node --check scripts/r26-incumbent-long-rescue.mjs
          node scripts/r26-incumbent-long-rescue.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-incumbent-long-rescue
          path: r26-study-output/
          retention-days: 30
