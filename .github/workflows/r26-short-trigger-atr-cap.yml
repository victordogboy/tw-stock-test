name: R26 short breakout entry time and equity risk 30k/35 ratio study
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-short-trigger-atr-cap.yml'
      - 'scripts/r26-short-trigger-atr-cap-search.mjs'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict R26 parity plus 1125 1m premarket short-order and circuit tests
        run: |
          node --check scripts/r26-short-trigger-atr-cap-search.mjs
          node scripts/r26-short-trigger-atr-cap-search.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-short-trigger-atr-cap-search
          path: r26-study-output/
          retention-days: 30
