name: FinMind-backed FC23/R1494 and C26 production source verification
on:
  push:
    branches: [main]
    paths:
      - 'public/r1494a/fc23/refresh-report.json'
      - 'public/r1494a/snapshot.bin'
      - '.github/workflows/finmind-production-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify deployed latest stock data without exposing FinMind token
        run: |
          node --input-type=module <<'JS'
          const base='https://tw-stock-api.victordogboy.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function read(path){
            const r=await fetch(base+path+(path.includes('?')?'&':'?')+'finmindverify='+Date.now(),{
              cache:'no-store',signal:AbortSignal.timeout(23000)
            });
            if(!r.ok)throw new Error(path+' HTTP '+r.status);
            return r.json();
          }
          let last={},pass=false;
          for(let attempt=1;attempt<=25;attempt++){
            try {
              const [fc,report,c26]=await Promise.all([
                read('/api/fc23/snapshot'),
                read('/r1494a/fc23/refresh-report.json'),
                read('/api/c26/status')
              ]);
              const fcDate=fc.data_as_of||null;
              const planDate=fc.plan?.signal_as_of||null;
              const source=c26.latest_market_data_as_of||null;
              const ok=report.verified===true&&report.fc23_date>='2026-11-12'&&
                fcDate>='2026-11-12'&&fc.sync_status==='current'&&
                c26.model_version==='C26'&&c26.plan?.readiness==='blocked'&&
                Array.isArray(c26.plan.actions)&&c26.plan.actions.length===0;
              last={attempt,verified:ok,fc23_date:fcDate,fc23_market_date:fc.market_as_of||null,
                fc23_sync_status:fc.sync_status,fc23_plan_readiness:fc.plan?.readiness||null,
                fc23_plan_signal_date:planDate,fc23_error:fc.lastError?.message||null,
                published_report_date:report.fc23_date,
                c26_shared_market_date:source,c26_source_status:c26.source_status,
                c26_live_plan:c26.plan.readiness,c26_has_live_positions:!c26.no_live_positions};
              if(ok){pass=true;break}
            }catch(e){last={attempt,error:String(e.message||e)}}
            await sleep(9000);
          }
          console.log('FINMIND_PRODUCTION_SOURCE_CHECK',JSON.stringify(last));
          if(!pass)process.exitCode=1;
          JS
