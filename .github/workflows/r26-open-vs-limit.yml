name: R26 original open versus premarket limit orders 1-minute research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-open-vs-limit.yml'
      - 'scripts/r26-open-vs-limit-research.mjs'
      - 'public/r26-research/open-limit-orders.mjs'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve R26 frozen 2428 gold and test true premarket limit fills, day/night overnight
        run: |
          node --check public/r26-research/open-limit-orders.mjs
          node --check scripts/r26-open-vs-limit-research.mjs
          node scripts/r26-open-vs-limit-research.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-open-vs-limit-trade-study
          path: r26-study-output/
          retention-days: 30
