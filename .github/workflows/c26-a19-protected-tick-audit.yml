name: C26 A19 protected multi-event morning tick feature audit
on:
  push:
    branches: [main]
    paths:
      - research/c26-lock/experiments/a19-tick-0930-study.mjs
      - .github/workflows/c26-a19-protected-tick-audit.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: c26-a19-tick-study
  cancel-in-progress: false
jobs:
  historical-ticks:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Validate script syntax
        run: node --check research/c26-lock/experiments/a19-tick-0930-study.mjs
      - name: Privately query pre-specified historic day stock pairs
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: node research/c26-lock/experiments/a19-tick-0930-study.mjs
      - name: Validate derived feature output only
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const x=JSON.parse(fs.readFileSync('research/c26-lock/experiments/A19_HISTORICAL_0930_TICK_FEATURES.json'));
          assert.equal(x.mode,'A19_RESEARCH_ONLY');
          assert.equal(x.requested_samples,17);
          assert.equal(x.samples.length,17);
          assert.ok(x.samples.every(z=>!Object.hasOwn(z,'raw')&&!Object.hasOwn(z,'ticks')));
          console.log('A19_SAMPLE_ACCESS',JSON.stringify({n:x.requested_samples,available:x.sufficient_sample_count,failed:x.failed_samples}));
          JS
      - name: Publish derived aggregates only with retry
        run: |
          set -euo pipefail
          cp research/c26-lock/experiments/A19_HISTORICAL_0930_TICK_FEATURES.json /tmp/A19_HISTORICAL_0930_TICK_FEATURES.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/A19_HISTORICAL_0930_TICK_FEATURES.json research/c26-lock/experiments/A19_HISTORICAL_0930_TICK_FEATURES.json
            git add research/c26-lock/experiments/A19_HISTORICAL_0930_TICK_FEATURES.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Research-only A19 precommitted 09:30 historical tick derived indicators'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
