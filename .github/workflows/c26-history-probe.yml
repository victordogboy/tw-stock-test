name: C26 private long-history FinMind access and month coverage probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research/c26-lock/experiments/history-fetch.mjs
      - research/c26-lock/experiments/history-priceid-probe.mjs
      - .github/workflows/c26-history-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate fetch code
        run: node --check research/c26-lock/experiments/history-fetch.mjs
      - name: Verify per-stock historical ranges are actually multi-day
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          node --check research/c26-lock/experiments/history-priceid-probe.mjs
          node research/c26-lock/experiments/history-priceid-probe.mjs
