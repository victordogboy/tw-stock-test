name: C26 private 2021-2026 all-market RS satellite long-horizon research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research/c26-lock/experiments/history-backtest.mjs
      - research/c26-lock/experiments/crash-reversal-history.mjs
      - research/c26-lock/experiments/history-fetch.mjs
      - .github/workflows/c26-rs-fiveyear-private.yml
permissions:
  contents: write
concurrency:
  group: c26-5year-rs-private-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Static security and syntax validation
        run: |
          node --check research/c26-lock/experiments/history-fetch.mjs
          node --check research/c26-lock/experiments/history-backtest.mjs
          node --check research/c26-lock/experiments/crash-reversal-history.mjs
          git diff --exit-code
      - name: Check FinMind multi-year entitlement with per-stock date_id
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: node research/c26-lock/experiments/history-priceid-probe.mjs
      - name: Download 233-stock historical OHLC privately; no licensed raw rows in output
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -euo pipefail
          node research/c26-lock/experiments/history-fetch.mjs --from=2021-01 --to=2026-10
      - name: Compare independent RS rebound, momentum, relay proxy versus original C26 NAV
        run: |
          set -euo pipefail
          node research/c26-lock/experiments/history-backtest.mjs
          node research/c26-lock/experiments/crash-reversal-history.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('research/c26-lock/experiments/RS_FIVEYEAR_PROXY_RESULTS.json'));
          assert.equal(r.configs,24);
          assert.equal(r.data_quality.monthly_files,70);
          assert.equal(r.data_quality.stock_count,233);
          assert.equal(r.data_quality.missing_session_days,0);
          assert.equal(r.pass_criteria.user_total_roundtrip_cost_pct,0.5855);
          assert.equal(r.pass_criteria.c26_historical_engine_changed,false);
          assert.equal(r.pass_criteria.output_raw_prices,false);
          assert.ok(r.results.every(x=>Number.isFinite(x.return_pct)&&Number.isFinite(x.max_dd_pct)));
          assert.ok(r.robustness.length===12);
          const crash=JSON.parse(fs.readFileSync('research/c26-lock/experiments/CRASH_REVERSAL_2021_2026_RESULTS.json'));
          assert.equal(crash.experimental_variants,48);
          assert.equal(crash.observations,1407);
          assert.equal(crash.universe_size,233);
          assert.equal(crash.source_quality.monthly_files,70);
          assert.equal(crash.source_quality.missing_exchange_sessions,0);
          assert.equal(crash.mode,'RESEARCH_ONLY');
          assert.ok(crash.results.every(x=>Number.isFinite(x.book_100pct_conditional_return_pct)&&Number.isFinite(x.book_closed_trade_equity_curve_max_dd_pct)));
          assert.ok(crash.results.every(x=>x.cap<=8));
          console.log('C26_CRASH_RESEARCH_SAFETY_PASS',JSON.stringify({n:crash.experimental_variants,window:crash.source_window}));
          console.log('C26_5YR_INDEPENDENT_PROXY_CHECKS_PASS',JSON.stringify({
            configs:r.configs,
            days:r.data_quality.backtest_days,
            corpEvents:r.data_quality.detected_large_unadjusted_price_events,
            studyOnly:true
          }));
          JS
      - name: Publish audited derived summaries without raw FinMind OHLC or JWT
        run: |
          set -euo pipefail
          cp research/c26-lock/experiments/RS_FIVEYEAR_PROXY_RESULTS.json /tmp/C26_5YR_RESULTS.json
          cp research/c26-lock/experiments/CRASH_REVERSAL_2021_2026_RESULTS.json /tmp/C26_CRASH_HISTORY_RESULTS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/C26_5YR_RESULTS.json research/c26-lock/experiments/RS_FIVEYEAR_PROXY_RESULTS.json
            cp /tmp/C26_CRASH_HISTORY_RESULTS.json research/c26-lock/experiments/CRASH_REVERSAL_2021_2026_RESULTS.json
            git add research/c26-lock/experiments/RS_FIVEYEAR_PROXY_RESULTS.json research/c26-lock/experiments/CRASH_REVERSAL_2021_2026_RESULTS.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish C26 research-only five-year RS sleeve proxy summary'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'C26 five-year summary could not be published'
          exit 1
