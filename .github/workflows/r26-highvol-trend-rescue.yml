name: R26 high-ATR trend vs chop rescue research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-highvol-trend-rescue.yml'
      - 'scripts/r26-highvol-trend-rescue.mjs'
      - 'public/r26-research/prior-regime-features.mjs'
      - 'public/r26-research/combined-breakout-risk.mjs'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit frozen original and ATR past-only alignment then test high-vol trend rescue
        run: |
          node --check scripts/r26-highvol-trend-rescue.mjs
          node --check public/r26-research/prior-regime-features.mjs
          node scripts/r26-highvol-trend-rescue.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-highvol-trend-rescue
          path: r26-study-output/
          retention-days: 30
