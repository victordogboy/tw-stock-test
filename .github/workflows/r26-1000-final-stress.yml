name: R26 1000 point DD candidates annual fee and simultaneous slippage stress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-1000-final-stress.yml'
      - 'scripts/r26-1000-final-cost-gap-stress.mjs'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original R26 frozen parity and realistic entry plus emergency stop cost tests
        run: |
          node --check scripts/r26-1000-final-cost-gap-stress.mjs
          node scripts/r26-1000-final-cost-gap-stress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-1000-final-annual-cost-stress
          path: r26-study-output/
          retention-days: 30
