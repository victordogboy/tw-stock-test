name: Verify TX VIX overlay

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/taiex-vix.mjs'
      - 'public/taiex-vix-sar.js'
      - 'public/taiex-vix-sar-ui.js'
      - 'tests/r50-vix-sar.test.cjs'
      - 'src/taiex-futures.mjs'
      - 'tests/r492-sources.test.mjs'
      - 'tests/r492-public-mode.test.cjs'
      - 'src/worker.mjs'
      - 'public/taiex-vix-overlay.js'
      - 'public/taiex-futures-ui.js'
      - 'public/futures.html'
      - 'tests/r49-taiex-vix.test.mjs'
      - 'tests/r49-taiex-vix-browser.test.cjs'
      - 'tests/r491-taiex-loading.test.cjs'
      - '.github/workflows/verify-taiex-vix.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check src/taiex-vix.mjs
          node --check src/worker.mjs
          node --check public/taiex-vix-overlay.js
          node --check public/taiex-futures-ui.js
      - name: VIX data and API unit tests
        run: node --test tests/r49-taiex-vix.test.mjs tests/r49-taiex-vix-browser.test.cjs tests/r491-taiex-loading.test.cjs tests/r36-taiex-ui.test.cjs tests/r492-sources.test.mjs tests/r492-public-mode.test.cjs tests/r50-vix-sar.test.cjs
      - name: Existing TX core regression tests (non-legacy browser fixtures)
        run: node --test tests/r36-taiex-api.test.mjs tests/r41-taiex-sample-diversity.test.cjs tests/r42-taiex-preflip-fiveyear.test.cjs tests/r45-taiex-regime-strategies.test.cjs tests/r46-dual-regime-walkforward.test.cjs tests/r47-pnl-attribution.test.cjs
