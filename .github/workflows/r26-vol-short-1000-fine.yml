name: R26 1000pt max drawdown volatility/short fine grid 1TX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-vol-short-1000-fine.yml'
      - 'scripts/r26-vol-short-1000-fine.mjs'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen baseline parity and integer TX ATR filtered premarket study
        run: |
          node --check scripts/r26-vol-short-1000-fine.mjs
          node scripts/r26-vol-short-1000-fine.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-vol-short-1000-fine
          path: r26-study-output/
          retention-days: 30
