name: R26 ATR percentile 35 margin constrained 2TX robustness and adverse costs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-pctl35-margin-stress.yml'
      - 'scripts/r26-pctl35-margin-stress-audit.mjs'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R26 35% percentile, account margin and per-period matched high fee and fill stress
        run: |
          node --check scripts/r26-pctl35-margin-stress-audit.mjs
          node scripts/r26-pctl35-margin-stress-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-pctl35-margin-stress
          path: r26-study-output/
          retention-days: 30
