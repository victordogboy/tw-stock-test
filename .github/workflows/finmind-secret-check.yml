name: FinMind credential and market-data health (no token logging)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify private FinMind credential and historical data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.FINMIND_TOKEN?.trim();
          if(!token){console.error('FINMIND_TOKEN repository secret is not set. Configure Settings > Secrets and variables > Actions > New repository secret.');process.exit(1)}
          const u=new URL('https://api.finmindtrade.com/api/v4/data');
          u.search=new URLSearchParams({dataset:'TaiwanStockPrice',start_date:'2026-11-12',end_date:'2026-11-13'}).toString();
          try{
            const r=await fetch(u,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(25000)});
            if(!r.ok){console.error('FinMind data request failed: HTTP',r.status);process.exit(1)}
            const result=await r.json();
            const daily=Array.isArray(result.data)?result.data.filter(x=>x.date==='2026-11-12'):[];
            const ids=new Set(daily.map(x=>x.stock_id));
            const required=['1565','3078','3081','3105','3152','3211','3227','3260'];
            const missing=required.filter(x=>!ids.has(x));
            const passed=result.status===200&&daily.length>=1500&&missing.length===0;
            console.log('FINMIND_DATA_CHECK',JSON.stringify({passed,date:'2026-11-12',finmind_status:result.status,records:daily.length,required_symbols_present:required.length-missing.length,missing_symbols:missing}));
            if(!passed)process.exitCode=1;
          }catch(e){
            console.error('FinMind data request failed:',e.name==='TimeoutError'?'request timeout':'connection or response invalid');
            process.exitCode=1;
          }
          JS
