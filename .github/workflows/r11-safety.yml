name: R11 Paper and Durable Object Write Guard
on:
  pull_request:
    paths:
      - 'src/r11-preopen.mjs'
      - 'src/r11-backfill.mjs'
      - 'src/worker.mjs'
      - 'src/fc23/service.mjs'
      - 'src/stock-futures-download.mjs'
      - 'public/r11/**'
      - 'tests/r11-*.test.mjs'
      - '.github/workflows/r11-safety.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R11 diagnostic API, price parity, durable write regression
        run: node --test public/r11/r11-plan.test.mjs tests/r11-preopen.test.mjs tests/r11-backfill.test.mjs tests/r11-minute-gaps.test.mjs tests/r11-session-trade-date.test.mjs tests/r11-causal-checkpoint.test.mjs tests/r11-incremental-resume.test.mjs tests/r11-p193-weights.test.mjs tests/r11-r26-core.test.mjs tests/r11-r26-daily.test.mjs tests/r11-do-storage-guard.test.mjs
