name: R26 live named-month intraday continuation probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r26-intraday-replay-live.yml']
  workflow_dispatch:
jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Replay official past plus actual vendor named monthly current minute bars
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import z from 'node:zlib';
          import {run,audit} from './public/r26-engine/engine.mjs';
          import {replayLive,mergeRecords,parseOfficialZip} from './public/r26-engine/live.mjs';
          import {extendTaifexCalendar2026} from './public/r26-engine/calendar-2026.mjs';
          const dir='./public/r26-engine/data/';
          const meta=JSON.parse(z.gunzipSync(fs.readFileSync(dir+'manifest.json.gz')));
          const raw=z.gunzipSync(Buffer.concat(meta.compressedParts.map(n=>fs.readFileSync(dir+n))));
          const bars=new Int32Array(raw.buffer,raw.byteOffset,raw.length/4);
          if(!audit(run(meta,bars,{end:meta.end}),meta).pass)throw Error('FROZEN_GOLDEN_FAIL');
          const seed=JSON.parse(z.gunzipSync(fs.readFileSync(dir+'recent.json.gz')));
          const calendar=extendTaifexCalendar2026(seed.calendar);
          const root='https://tw-stock-api.victordogboy.workers.dev',contract='202611';
          let records=seed.rows.slice(),counts=[];
          for(const date of calendar.filter(d=>d>'2026-10-22'&&d<='2026-11-10')){
           const rsp=await fetch(root+'/api/r26/official-zip?date='+date+'&contract='+contract,
             {signal:AbortSignal.timeout(30000)});
           if(!rsp.ok)throw Error('OFFICIAL_HTTP_'+date+'_'+rsp.status);
           const rr=await parseOfficialZip(await rsp.arrayBuffer(),date,contract);
           records=mergeRecords(records,rr);counts.push([date,rr.length]);
          }
          const rsp=await fetch(root+'/api/r26/intraday?contract='+contract,{signal:AbortSignal.timeout(20000)});
          if(!rsp.ok)throw Error('NAMED_MONTH_HTTP_'+rsp.status);
          const payload=await rsp.json();const now=Date.now();
          records=mergeRecords(records,payload.data);
          const r=replayLive(meta,bars,records,calendar,now);
          const summary={run_time:new Date(now).toISOString(),named_month_count:payload.data.length,
           named_first:payload.data[0]?.timestamp_tpe,named_last:payload.data.at(-1)?.timestamp_tpe,
           official_day_counts:counts,ready:r.ready,positionConfirmed:r.positionConfirmed,
           added:r.added,as_of:r.as_of,issues:r.issues,current_state:r.sessionStates.slice(-3),
           row:r.row,events:r.events,pnl_after_cutoff:r.newPnl,cumulative:r.total};
          fs.writeFileSync('r26-real-current-session.json',JSON.stringify(summary,null,2));
          console.log('R26_INTRADAY_SUMMARY',JSON.stringify(summary));
          if(!r.ready||!r.positionConfirmed)throw Error('R26_CURRENT_SESSION_NOT_READY');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-real-current-session
          path: r26-real-current-session.json
