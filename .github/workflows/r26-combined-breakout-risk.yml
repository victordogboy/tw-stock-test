name: R26 premarket breakout plus max-drawdown circuit integrated
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-combined-breakout-risk.yml'
      - 'scripts/r26-combined-breakout-risk.mjs'
      - 'public/r26-research/combined-breakout-risk.mjs'
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original, breakout-only and risk-only zero-difference before exploring combinations
        run: |
          node --check public/r26-research/combined-breakout-risk.mjs
          node --check scripts/r26-combined-breakout-risk.mjs
          node scripts/r26-combined-breakout-risk.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-combined-breakout-risk
          path: r26-study-output/
          retention-days: 30
