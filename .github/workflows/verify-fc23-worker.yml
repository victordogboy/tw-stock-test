name: Verify R1494-A and FC23 on Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'public/r1494a/index.html'
      - 'public/r1494a/fc23/**'
      - 'tests/fc23-full-archive.test.mjs'
      - '.github/workflows/verify-fc23-worker.yml'
  workflow_dispatch:
jobs:
  smoke-check-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check existing R1494-A and FC23 on real workers.dev domain
        shell: bash
        run: |
          set -euo pipefail
          base='https://tw-stock-api.victordogboy.workers.dev'
          echo "Verifying exact production Worker domain, not GitHub Pages"
          ready=0
          for n in $(seq 1 30); do
            status=$(curl -sSL --retry 1 --connect-timeout 8 --max-time 20 -o /tmp/fc23.html -w '%{http_code}' "$base/r1494a/fc23/?verify=$GITHUB_SHA" || true)
            if [ "$status" = "200" ] && grep -q "FC23-PEER50-LOCK" /tmp/fc23.html; then
              ready=1
              break
            fi
            echo "Attempt $n/30: FC23 not yet at worker ($status)"
            sleep 10
          done
          test "$ready" = 1 || { echo "::error::FC23 has not appeared on the Cloudflare Worker"; exit 1; }
          curl -fsSL --connect-timeout 8 --max-time 30 "$base/r1494a/" > /tmp/r1494.html
          grep -q "R1494-A" /tmp/r1494.html
          grep -q "href=\"./fc23/\"" /tmp/r1494.html
          curl -fsSL --connect-timeout 8 --max-time 30 "$base/r1494a/fc23/snapshot.json" > /tmp/fc23.json
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('/tmp/fc23.json','utf8'));
          if(j.strategy!=='FC23-PEER50-LOCK'||j.end_date!=='2026-10-27'||j.live_plan_available!==false||j.live_execution_allowed!==false)throw Error('FC23 archival data or safe-mode mismatch');
          console.log('PASS: production R1494-A preserved, FC23 accessible, stale data properly gated');
          JS
          # Verify complete FC23 archived replay is actually published on workers.dev
          archive_ready=0
          for retry in $(seq 1 30); do
            js_code=$(curl -sSL --connect-timeout 8 --max-time 25 -o /tmp/fc23-full.js -w '%{http_code}' "$base/r1494a/fc23/full-archive.js?sha=$GITHUB_SHA" || true)
            manifest_code=$(curl -sSL --connect-timeout 8 --max-time 25 -o /tmp/fc23-manifest.json -w '%{http_code}' "$base/r1494a/fc23/archive/manifest.json?sha=$GITHUB_SHA" || true)
            first_code=$(curl -sSL --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code}' "$base/r1494a/fc23/archive/part01.txt?sha=$GITHUB_SHA" || true)
            if [ "$js_code" = "200" ] && [ "$manifest_code" = "200" ] && [ "$first_code" = "200" ] && grep -q 'readFullArchive' /tmp/fc23-full.js; then archive_ready=1; break; fi
            echo "Waiting for Worker full FC23 archive publish: $retry / 30 (JS=$js_code, manifest=$manifest_code, part1=$first_code)"
            sleep 10
          done
          test "$archive_ready" = 1 || { echo "::error::Cloudflare Worker still missing latest FC23 archive"; exit 1; }
          for n in $(seq -w 1 8); do
            curl -fsSL --connect-timeout 8 --max-time 25 "$base/r1494a/fc23/archive/part$n.txt" >> /tmp/fc23-parts.b64
          done
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          const m=JSON.parse(readFileSync('/tmp/fc23-manifest.json'));
          const gz=Buffer.from(readFileSync('/tmp/fc23-parts.b64','utf8'),'base64');
          const sha=createHash('sha256').update(gz).digest('hex');
          if(sha!==m.sha256_gzip)throw Error('FC23 production archive checksum mismatch');
          const h=JSON.parse(gunzipSync(gz));
          for(const [k,count] of Object.entries(m.counts))if(h[k]?.length!==count)throw Error('FC23 production archive count mismatch: '+k);
          if(h.daily_nav.at(-1).date!=='2026-10-27')throw Error('FC23 history timestamp mismatch');
          console.log('PASS Cloudflare production FC23: 1773 orders, 7638 plans, 1407 NAV, SHA256 verified');
          JS
