name: R26 ATR high-vol regime stop-entry robust neighborhood
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-regime-local-price-and-trend.yml'
      - 'scripts/r26-regime-local-price-and-trend.mjs'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact R26 replay, local stop-entry ATR regime and low-DD cost robustness
        run: |
          node --check scripts/r26-regime-local-price-and-trend.mjs
          node scripts/r26-regime-local-price-and-trend.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-regime-local-price-and-trend
          path: r26-study-output/
          retention-days: 30
