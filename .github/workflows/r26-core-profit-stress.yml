name: R26 core exits official holdout and transaction cost stress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r26-core-profit-stress.yml'
      - 'scripts/r26-core-profit-stress.mjs'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original engine strict parity then extension + fee stress
        run: node scripts/r26-core-profit-stress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-core-profit-official-extension-stress
          path: r26-study-output/
          retention-days: 30
