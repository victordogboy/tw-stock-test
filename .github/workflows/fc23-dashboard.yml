name: FC23 dashboard parity and historical-data test
on:
  push:
    branches: [main]
    paths:
      - 'public/r1494a/fc23/**'
      - 'public/r1494a/index.html'
      - 'public/r1494a/strategy-switch.js'
      - 'tests/strategy-switch.test.mjs'
      - 'src/fc23/**'
      - 'tests/fc23-live.test.mjs'
      - 'tests/fc23-refresh-contract.test.mjs'
      - 'tests/fixtures/fc23-*.b64'
      - 'public/r1494a/snapshot.bin'
      - 'tests/fc23-dashboard.test.mjs'
      - 'tests/fc23-full-archive.test.mjs'
      - '.github/workflows/fc23-dashboard.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run FC23 real snapshot rendering, safety and benchmarks
        run: |
          node tests/fc23-dashboard.test.mjs
          node tests/fc23-full-archive.test.mjs
          node tests/strategy-switch.test.mjs
          node tests/fc23-live.test.mjs
          node tests/fc23-refresh-contract.test.mjs
